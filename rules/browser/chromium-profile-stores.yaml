schema_version: 1
id: browser.chromium.profile-stores
name: Chromium Profile Stores
description: >
  Chromium profile directories can contain saved passwords, cookies, local
  encryption state, autofill data, payment data, and session artifacts.
category: browser
subcategory: chromium
artifact_types:
  - password-store
  - cookie
  - session
  - configuration
sensitivity: critical
match:
  paths:
    - path: '%LOCALAPPDATA%\Chromium\User Data\'
      kind: directory
      platforms: [windows]
    - path: "$HOME/.config/chromium/"
      kind: directory
      platforms: [linux]
    - path: "$HOME/Library/Application Support/Chromium/"
      kind: directory
      platforms: [macos]
credentials:
  types:
    - saved-password
    - session-cookie
impact:
  credential_access: true
tags:
  - browser
  - chromium
  - credentials
  - cookies
references:
  - name: "Threat Hunting: Detecting Browser Credential Stealing [T1555.003]"
    url: https://fourcore.io/blogs/threat-hunting-browser-credential-stealing
metadata:
  confidence: medium
