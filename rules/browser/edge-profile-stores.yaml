schema_version: 1
id: browser.edge.profile-stores
name: Edge Profile Stores
description: >
  Microsoft Edge profile directories can contain saved passwords, cookies,
  local encryption state, autofill data, payment data, and session artifacts.
category: browser
subcategory: edge
artifact_types:
  - password-store
  - cookie
  - session
  - configuration
sensitivity: critical
match:
  paths:
    - path: '%LOCALAPPDATA%\Microsoft\Edge\User Data\'
      kind: directory
      platforms: [windows]
    - path: "$HOME/.config/microsoft-edge/"
      kind: directory
      platforms: [linux]
    - path: "$HOME/Library/Application Support/Microsoft Edge/"
      kind: directory
      platforms: [macos]
credentials:
  types:
    - saved-password
    - session-cookie
impact:
  credential_access: true
tags:
  - browser
  - edge
  - credentials
  - cookies
references:
  - name: "Threat Hunting: Detecting Browser Credential Stealing [T1555.003]"
    url: https://fourcore.io/blogs/threat-hunting-browser-credential-stealing
  - name: "eSentire Threat Intelligence Malware Analysis: Vidar Stealer"
    url: https://www.esentire.com/blog/esentire-threat-intelligence-malware-analysis-vidar-stealer
  - name: Contagious Interview Malware SVG Steganography
    url: https://www.elastic.co/security-labs/contagious-interview-malware-svg-steganography
metadata:
  confidence: medium
