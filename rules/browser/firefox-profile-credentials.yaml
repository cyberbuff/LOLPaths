schema_version: 1
id: browser.firefox-profile-credentials
name: Firefox Profile Credentials
description: >
  Firefox profile credential and cookie files can contain saved passwords,
  password database keys, cookies, and browser session state.
category: browser
subcategory: firefox
artifact_types:
  - password-store
  - cookie
  - session
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\Mozilla\Firefox\Profiles\*\logins.json'
      kind: glob
      platforms: [windows]
    - path: '%APPDATA%\Mozilla\Firefox\Profiles\*\key4.db'
      kind: glob
      platforms: [windows]
    - path: '%APPDATA%\Mozilla\Firefox\Profiles\*\key3.db'
      kind: glob
      platforms: [windows]
    - path: '%APPDATA%\Mozilla\Firefox\Profiles\*\cookies.sqlite'
      kind: glob
      platforms: [windows]
credentials:
  types:
    - saved-password
    - session-cookie
impact:
  credential_access: true
tags:
  - browser
  - firefox
  - credentials
  - cookies
references:
  - name: "Threat Hunting: Detecting Browser Credential Stealing [T1555.003]"
    url: https://fourcore.io/blogs/threat-hunting-browser-credential-stealing
  - name: "eSentire Threat Intelligence Malware Analysis: Vidar Stealer"
    url: https://www.esentire.com/blog/esentire-threat-intelligence-malware-analysis-vidar-stealer
metadata:
  confidence: medium
