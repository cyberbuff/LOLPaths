schema_version: 1
id: browser.opera.profile-stores
name: Opera Profile Stores
description: >
  Opera profile directories can contain saved passwords, cookies, local
  encryption state, autofill data, payment data, and session artifacts.
category: browser
subcategory: opera
artifact_types:
  - password-store
  - cookie
  - session
  - configuration
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\Opera Software\Opera Stable\'
      kind: directory
      platforms: [windows]
    - path: "$HOME/.config/opera/"
      kind: directory
      platforms: [linux]
    - path: "$HOME/Library/Application Support/com.operasoftware.Opera/"
      kind: directory
      platforms: [macos]
credentials:
  types:
    - saved-password
    - session-cookie
impact:
  credential_access: true
tags:
  - browser
  - opera
  - credentials
  - cookies
references:
  - name: "Threat Hunting: Detecting Browser Credential Stealing [T1555.003]"
    url: https://fourcore.io/blogs/threat-hunting-browser-credential-stealing
  - name: Contagious Interview Malware SVG Steganography
    url: https://www.elastic.co/security-labs/contagious-interview-malware-svg-steganography
metadata:
  confidence: medium
