schema_version: 1
id: application.telegram-desktop-tdata
name: Telegram Desktop tdata
description: >
  Telegram Desktop tdata directories can contain encrypted local session and
  account artifacts.
category: application
subcategory: telegram
artifact_types:
  - session
  - configuration
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\Telegram Desktop\tdata\'
      kind: directory
      platforms: [windows]
    - path: "$HOME/Library/Application Support/Telegram Desktop/tdata/"
      kind: directory
      platforms: [macos]
credentials:
  types:
    - session-token
impact:
  credential_access: true
tags:
  - telegram
  - session
references:
  - name: "Whispers of Atlantida: Safeguarding Your Digital Treasure"
    url: https://www.rapid7.com/blog/post/2024/01/17/whispers-of-atlantida-safeguarding-your-digital-treasure/
  - name: "eSentire Threat Intelligence Malware Analysis: Vidar Stealer"
    url: https://www.esentire.com/blog/esentire-threat-intelligence-malware-analysis-vidar-stealer
  - name: RustDoor and Koi Stealer for macOS
    url: https://unit42.paloaltonetworks.com/macos-malware-targets-crypto-sector/
metadata:
  confidence: high
