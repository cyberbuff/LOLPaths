schema_version: 1
id: containers.runtime-secret-files
name: Container Runtime Secret Files
description: >
  Runtime secret mount directories can contain injected credentials, tokens,
  certificates, and application secrets.
category: containers
artifact_types:
  - credential
  - token
  - configuration
sensitivity: critical
match:
  paths:
    - path: "/run/secrets/**"
      kind: glob
      platforms: [linux]
    - path: "/var/secrets/**"
      kind: glob
      platforms: [linux]
credentials:
  types:
    - password
    - access-token
    - private-key
impact:
  credential_access: true
tags:
  - container
  - secrets
references:
  - name: Docker secrets
    url: https://docs.docker.com/engine/swarm/secrets/
  - name: TrendAI LiteLLM supply chain compromise
    url: https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/inside-litellm-supply-chain-compromise
metadata:
  confidence: medium
