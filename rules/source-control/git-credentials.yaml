schema_version: 1
id: source-control.git-credentials
name: Git Credentials
description: >
  Git credential store files can contain usernames, passwords, or tokens for remotes.
category: source-control
subcategory: git
artifact_types:
  - credential
sensitivity: critical
match:
  paths:
    - path: '%USERPROFILE%\.git-credentials'
      kind: file
      platforms: [windows]
    - path: "$HOME/.git-credentials"
      kind: file
      platforms: [linux, macos]
credentials:
  types:
    - password
    - access-token
impact:
  credential_access: true
  source_code_access: true
tags:
  - git
references:
  - name: git-credential-store
    url: https://git-scm.com/docs/git-credential-store
metadata:
  confidence: high
