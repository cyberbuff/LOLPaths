schema_version: 1
id: package-manager.cargo-credentials
name: Cargo Registry Credentials
description: >
  Cargo registry credential files can contain tokens for publishing Rust crates
  or authenticating to private registries.
category: package-manager
subcategory: cargo
artifact_types:
  - credential
  - configuration
sensitivity: critical
match:
  paths:
    - path: '%USERPROFILE%\.cargo\credentials.toml'
      kind: file
      platforms: [windows]
    - path: "$HOME/.cargo/credentials.toml"
      kind: file
      platforms: [linux, macos]
  content:
    regex:
      - '(?i)token\s*='
credentials:
  types:
    - access-token
impact:
  credential_access: true
tags:
  - cargo
  - rust
references:
  - name: "Analyzing TeamPCP's Supply Chain Attacks"
    url: https://www.trendmicro.com/en_us/research/26/e/analyzing-teampcp-supply-chain-attacks.html
metadata:
  confidence: high
