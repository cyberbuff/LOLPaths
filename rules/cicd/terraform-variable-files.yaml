schema_version: 1
id: infrastructure.terraform-variable-files
name: Terraform Variable Files
description: >
  Terraform variable definition files can contain provider inputs, credentials,
  or secret values used during infrastructure provisioning.
category: infrastructure
subcategory: terraform
artifact_types:
  - configuration
  - credential
sensitivity: high
match:
  paths:
    - path: "**/terraform.tfvars"
      kind: glob
      platforms: [windows, linux, macos]
    - path: "**/terraform.tfvars.json"
      kind: glob
      platforms: [windows, linux, macos]
    - path: "**/*.auto.tfvars"
      kind: glob
      platforms: [windows, linux, macos]
    - path: "**/*.auto.tfvars.json"
      kind: glob
      platforms: [windows, linux, macos]
  content:
    contains:
      - password
      - secret
      - token
credentials:
  types:
    - password
    - access-token
impact:
  credential_access: true
  discovery: true
tags:
  - terraform
references:
  - name: Terraform Variable Definitions
    url: https://developer.hashicorp.com/terraform/language/values/variables#variable-definitions-tfvars-files
metadata:
  confidence: high
