schema_version: 1
id: cicd.jenkins.credentials
name: Jenkins Credential Store Files
description: >
  Jenkins credential store files and secrets directories can contain encrypted
  credentials and key material used by a Jenkins controller.
category: cicd
subcategory: jenkins
artifact_types:
  - credential
  - configuration
sensitivity: critical
match:
  paths:
    - path: "$JENKINS_HOME/credentials.xml"
      kind: file
      platforms: [linux, macos]
    - path: "$JENKINS_HOME/secrets/"
      kind: directory
      platforms: [linux, macos]
    - path: '%PROGRAMDATA%\Jenkins\.jenkins\credentials.xml'
      kind: file
      platforms: [windows]
credentials:
  types:
    - password
    - private-key
    - access-token
impact:
  credential_access: true
  lateral_movement: true
tags:
  - jenkins
  - cicd
references:
  - name: Jenkins Credentials
    url: https://www.jenkins.io/doc/book/security/credentials/
  - name: Jenkins Storing Secrets
    url: https://www.jenkins.io/doc/developer/security/secrets/
metadata:
  confidence: high
