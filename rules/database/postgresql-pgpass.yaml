schema_version: 1
id: database.postgresql.pgpass
name: PostgreSQL Password File
description: >
  PostgreSQL password files store connection credentials for libpq clients.
category: database
subcategory: postgresql
artifact_types:
  - credential
  - database
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\postgresql\pgpass.conf'
      kind: file
      platforms: [windows]
    - path: "$HOME/.pgpass"
      kind: file
      platforms: [linux, macos]
    - path: "/var/lib/postgresql/.pgpass"
      kind: file
      platforms: [linux]
credentials:
  types:
    - password
impact:
  credential_access: true
tags:
  - postgresql
references:
  - name: PostgreSQL Password File
    url: https://www.postgresql.org/docs/current/libpq-pgpass.html
metadata:
  confidence: high
