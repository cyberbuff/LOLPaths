schema_version: 1
id: database.mysql.history
name: MySQL Client History
description: >
  MySQL client history files can contain connection details, commands, or
  authentication material.
category: database
subcategory: mysql
artifact_types:
  - history
  - database
sensitivity: high
match:
  paths:
    - path: "$HOME/.mysql_history"
      kind: file
      platforms: [linux, macos]
impact:
  credential_access: true
  discovery: true
tags:
  - mysql
  - history
references:
  - name: MySQL Client Logging
    url: https://dev.mysql.com/doc/refman/8.0/en/mysql-logging.html
metadata:
  confidence: high
