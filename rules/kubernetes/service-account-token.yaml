schema_version: 1
id: kubernetes.service-account-token
name: Kubernetes Service Account Token
description: >
  Mounted Kubernetes service account tokens can authenticate workloads to the API server.
category: kubernetes
artifact_types:
  - credential
  - token
sensitivity: critical
match:
  paths:
    - path: "/var/run/secrets/kubernetes.io/serviceaccount/token"
      kind: file
      platforms: [linux]
    - path: "/run/secrets/kubernetes.io/serviceaccount/token"
      kind: file
      platforms: [linux]
credentials:
  types:
    - bearer-token
impact:
  credential_access: true
  remote_access: true
scope:
  environments:
    - container
    - kubernetes-node
tags:
  - kubernetes
  - service-account
references:
  - name: Kubernetes Configure Service Accounts for Pods
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
metadata:
  confidence: high
