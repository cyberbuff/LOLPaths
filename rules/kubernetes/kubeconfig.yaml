schema_version: 1
id: kubernetes.kubeconfig
name: Kubernetes Kubeconfig
description: >
  Kubernetes client configuration may contain cluster endpoints, client
  certificates, bearer tokens, or references to authentication material.
category: kubernetes
artifact_types:
  - configuration
  - credential
sensitivity: critical
match:
  paths:
    - path: '%USERPROFILE%\.kube\config'
      kind: file
      platforms: [windows]
    - path: "$HOME/.kube/config"
      kind: file
      platforms: [linux, macos]
    - path: "/etc/kubernetes/admin.conf"
      kind: file
      platforms: [linux]
    - path: "/etc/kubernetes/kubelet.conf"
      kind: file
      platforms: [linux]
    - path: "/etc/kubernetes/controller-manager.conf"
      kind: file
      platforms: [linux]
    - path: "/etc/kubernetes/scheduler.conf"
      kind: file
      platforms: [linux]
  content:
    contains:
      - "apiVersion:"
      - "clusters:"
      - "contexts:"
credentials:
  types:
    - bearer-token
    - certificate
    - private-key
impact:
  credential_access: true
  remote_access: true
tags:
  - kubernetes
  - kubeconfig
references:
  - name: Kubernetes Kubeconfig Files
    url: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
metadata:
  confidence: high
