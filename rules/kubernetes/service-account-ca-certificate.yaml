schema_version: 1
id: kubernetes.service-account-ca-certificate
name: Kubernetes Service Account CA Certificate
description: >
  Mounted Kubernetes service account CA certificates identify the cluster API
  trust root and support in-cluster API discovery.
category: kubernetes
artifact_types:
  - certificate
  - configuration
sensitivity: medium
match:
  paths:
    - path: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      kind: file
      platforms: [linux]
    - path: "/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      kind: file
      platforms: [linux]
impact:
  discovery: true
scope:
  environments:
    - container
    - kubernetes-node
tags:
  - kubernetes
  - service-account
  - certificate
references:
  - name: Kubernetes Configure Service Accounts for Pods
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  - name: TrendAI LiteLLM supply chain compromise
    url: https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/inside-litellm-supply-chain-compromise
metadata:
  confidence: high
