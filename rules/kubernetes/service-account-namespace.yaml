schema_version: 1
id: kubernetes.service-account-namespace
name: Kubernetes Service Account Namespace
description: >
  Mounted Kubernetes service account namespace files reveal the namespace used
  for in-cluster API requests.
category: kubernetes
artifact_types:
  - configuration
sensitivity: informational
match:
  paths:
    - path: "/var/run/secrets/kubernetes.io/serviceaccount/namespace"
      kind: file
      platforms: [linux]
    - path: "/run/secrets/kubernetes.io/serviceaccount/namespace"
      kind: file
      platforms: [linux]
impact:
  discovery: true
scope:
  environments:
    - container
    - kubernetes-node
tags:
  - kubernetes
  - service-account
references:
  - name: Kubernetes Configure Service Accounts for Pods
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  - name: TrendAI LiteLLM supply chain compromise
    url: https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/inside-litellm-supply-chain-compromise
metadata:
  confidence: high
