schema_version: 1
id: crypto-wallet.electron-cash.wallets
name: Electron Cash Wallet Files
description: >
  Electron Cash wallet directories can contain wallet files and private key
  material.
category: crypto-wallet
subcategory: electron-cash
artifact_types:
  - wallet
  - credential
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\ElectronCash\wallets\'
      kind: directory
      platforms: [windows]
credentials:
  types:
    - private-key
impact:
  credential_access: true
tags:
  - wallet
  - electron-cash
references:
  - name: Stealc Infostealer Analysis
    url: https://blog.sekoia.io/stealc-a-copycat-of-vidar-and-raccoon-infostealers-gaining-in-popularity-part-1/
metadata:
  confidence: high
