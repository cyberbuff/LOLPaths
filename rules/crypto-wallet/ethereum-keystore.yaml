schema_version: 1
id: crypto-wallet.ethereum.keystore
name: Ethereum Keystore Directory
description: >
  Ethereum keystore directories can contain encrypted account key files.
category: crypto-wallet
subcategory: ethereum
artifact_types:
  - wallet
  - credential
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\Ethereum\keystore\'
      kind: directory
      platforms: [windows]
    - path: "$HOME/.ethereum/keystore/"
      kind: directory
      platforms: [linux, macos]
credentials:
  types:
    - private-key
impact:
  credential_access: true
tags:
  - wallet
  - ethereum
references:
  - name: Geth Account Management
    url: https://geth.ethereum.org/docs/tools/clef/introduction#basic-usage
  - name: Stealc Infostealer Analysis
    url: https://blog.sekoia.io/stealc-a-copycat-of-vidar-and-raccoon-infostealers-gaining-in-popularity-part-1/
metadata:
  confidence: high
