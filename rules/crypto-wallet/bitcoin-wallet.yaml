schema_version: 1
id: crypto-wallet.bitcoin.wallets
name: Bitcoin Core Wallet Directory
description: >
  Bitcoin Core data directories can contain wallet databases and private key material.
category: crypto-wallet
subcategory: bitcoin
artifact_types:
  - wallet
  - credential
sensitivity: critical
match:
  paths:
    - path: "$HOME/.bitcoin/"
      kind: directory
      platforms: [linux, macos]
credentials:
  types:
    - private-key
impact:
  credential_access: true
tags:
  - wallet
  - bitcoin
references:
  - name: Bitcoin Core Files
    url: https://github.com/bitcoin/bitcoin/blob/master/doc/files.md
metadata:
  confidence: medium
