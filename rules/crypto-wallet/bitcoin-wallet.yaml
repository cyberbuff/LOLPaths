schema_version: 1
id: crypto-wallet.bitcoin.wallets
name: Bitcoin Core Wallet Directory
description: >
  Bitcoin Core data directories can contain wallet databases and private key material.
category: crypto-wallet
subcategory: bitcoin
artifact_types:
  - wallet
  - credential
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\Bitcoin\wallets\'
      kind: directory
      platforms: [windows]
    - path: '%APPDATA%\Bitcoin\*wallet*.dat'
      kind: glob
      platforms: [windows]
    - path: "$HOME/.bitcoin/"
      kind: directory
      platforms: [linux, macos]
credentials:
  types:
    - private-key
impact:
  credential_access: true
tags:
  - wallet
  - bitcoin
references:
  - name: Bitcoin Core Files
    url: https://github.com/bitcoin/bitcoin/blob/master/doc/files.md
  - name: Stealc Infostealer Analysis
    url: https://blog.sekoia.io/stealc-a-copycat-of-vidar-and-raccoon-infostealers-gaining-in-popularity-part-1/
metadata:
  confidence: high
