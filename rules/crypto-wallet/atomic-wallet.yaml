schema_version: 1
id: crypto-wallet.atomic.wallets
name: Atomic Wallet Storage
description: >
  Atomic Wallet local storage directories can contain wallet state and secret
  material.
category: crypto-wallet
subcategory: atomic
artifact_types:
  - wallet
  - credential
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\atomic\Local Storage\leveldb\'
      kind: directory
      platforms: [windows]
credentials:
  types:
    - private-key
impact:
  credential_access: true
tags:
  - wallet
  - atomic
references:
  - name: Stealc Infostealer Analysis
    url: https://blog.sekoia.io/stealc-a-copycat-of-vidar-and-raccoon-infostealers-gaining-in-popularity-part-1/
  - name: Akira Stealer Technical Analysis
    url: https://www.glueckkanja.com/en/posts/2025-06-16-quiet-breach
metadata:
  confidence: high
