schema_version: 1
id: crypto-wallet.dash.wallets
name: Dash Core Wallet Directory
description: >
  Dash Core data directories can contain wallet databases and private key material.
category: crypto-wallet
subcategory: dash
artifact_types:
  - wallet
  - credential
sensitivity: critical
match:
  paths:
    - path: "$HOME/.dashcore/"
      kind: directory
      platforms: [linux, macos]
credentials:
  types:
    - private-key
impact:
  credential_access: true
tags:
  - wallet
  - dash
references:
  - name: Dash Core Files
    url: https://github.com/dashpay/dash/blob/master/doc/files.md
metadata:
  confidence: medium
