schema_version: 1
id: crypto-wallet.multidoge.wallet
name: MultiDoge Wallet File
description: >
  MultiDoge wallet files can contain wallet databases and private key material.
category: crypto-wallet
subcategory: multidoge
artifact_types:
  - wallet
  - credential
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\MultiDoge\multidoge.wallet'
      kind: file
      platforms: [windows]
credentials:
  types:
    - private-key
impact:
  credential_access: true
tags:
  - wallet
  - multidoge
references:
  - name: Stealc Infostealer Analysis
    url: https://blog.sekoia.io/stealc-a-copycat-of-vidar-and-raccoon-infostealers-gaining-in-popularity-part-1/
metadata:
  confidence: high
