schema_version: 1
id: vpn.wireguard-config
name: WireGuard Configuration
description: >
  WireGuard configuration files commonly contain interface private keys and
  peer connection details.
category: vpn
subcategory: wireguard
artifact_types:
  - configuration
  - credential
  - private-key
sensitivity: critical
match:
  paths:
    - path: "/etc/wireguard/*.conf"
      kind: glob
      platforms: [linux]
  content:
    contains:
      - PrivateKey
      - "[Interface]"
credentials:
  types:
    - private-key
impact:
  credential_access: true
  remote_access: true
tags:
  - wireguard
  - vpn
references:
  - name: wg-quick
    url: https://man7.org/linux/man-pages/man8/wg-quick.8.html
  - name: TrendAI LiteLLM supply chain compromise
    url: https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/inside-litellm-supply-chain-compromise
metadata:
  confidence: high
