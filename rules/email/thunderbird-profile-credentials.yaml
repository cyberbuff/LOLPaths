schema_version: 1
id: email.thunderbird.profile-credentials
name: Thunderbird Profile Credentials
description: >
  Thunderbird profile files can contain saved mail account credentials and key
  database material.
category: email
subcategory: thunderbird
artifact_types:
  - password-store
  - credential
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\Thunderbird\Profiles\*\logins.json'
      kind: glob
      platforms: [windows]
    - path: '%APPDATA%\Thunderbird\Profiles\*\key4.db'
      kind: glob
      platforms: [windows]
credentials:
  types:
    - saved-password
impact:
  credential_access: true
tags:
  - thunderbird
  - email
references:
  - name: StrelaStealer Malware Analysis
    url: https://fortgale.com/blog/malware-analysis/strelastealer-malware-analysis-2/
metadata:
  confidence: high
