schema_version: 1
id: email.postfix-sasl-passwords
name: Postfix SASL Password Map
description: >
  Postfix SASL password maps store relay authentication credentials.
category: email
subcategory: postfix
artifact_types:
  - credential
  - configuration
sensitivity: critical
match:
  paths:
    - path: "/etc/postfix/sasl_passwd"
      kind: file
      platforms: [linux]
credentials:
  types:
    - password
impact:
  credential_access: true
  remote_access: true
tags:
  - postfix
  - smtp
references:
  - name: Postfix SASL README
    url: http://www.postfix.org/SASL_README.html
  - name: TrendAI LiteLLM supply chain compromise
    url: https://www.trendaisecurity.com/en-us/resources-insights/trendai-security-blog/inside-litellm-supply-chain-compromise
metadata:
  confidence: high
