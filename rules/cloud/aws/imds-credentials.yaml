schema_version: 1
id: cloud.aws.imds-credentials
name: AWS Instance Metadata Credentials
description: >
  AWS Instance Metadata Service endpoints can provide IMDSv2 tokens and
  temporary IAM role security credentials to software running on EC2 instances.
category: cloud
subcategory: aws
artifact_types:
  - credential
  - token
sensitivity: critical
match:
  content:
    contains:
      - "169.254.169.254"
      - "/latest/api/token"
      - "/latest/meta-data/iam/security-credentials/"
credentials:
  types:
    - session-token
    - access-key
    - secret-access-key
impact:
  credential_access: true
  cloud_access: true
tags:
  - aws
  - imds
  - cloud
references:
  - name: Amazon EC2 Instance Metadata Service
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html
  - name: IAM Roles for Amazon EC2
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html
metadata:
  confidence: high
