schema_version: 1
id: cloud.aws.credentials
name: AWS CLI Credentials
description: >
  AWS CLI credential files may contain access keys, secret access keys,
  and temporary session tokens.
category: cloud
subcategory: aws
artifact_types:
  - credential
  - configuration
sensitivity: critical
match:
  paths:
    - path: '%USERPROFILE%\.aws\credentials'
      kind: file
      platforms: [windows]
    - path: "$HOME/.aws/credentials"
      kind: file
      platforms: [linux, macos]
  content:
    contains:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_session_token
    regex:
      - '(?i)aws_access_key_id\s*='
      - '(?i)aws_secret_access_key\s*='
credentials:
  types:
    - access-key
    - secret-access-key
    - session-token
impact:
  credential_access: true
  cloud_access: true
tags:
  - aws
  - cloud
  - credentials
references:
  - name: AWS CLI Configuration and Credential File Settings
    url: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
metadata:
  confidence: high

