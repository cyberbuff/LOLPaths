schema_version: 1
id: cloud.gcp.application-default-credentials
name: Google Cloud Application Default Credentials
description: >
  Application Default Credentials may contain OAuth refresh tokens or service
  account material used by Google Cloud tooling.
category: cloud
subcategory: gcp
artifact_types:
  - credential
  - configuration
sensitivity: critical
match:
  paths:
    - path: '%APPDATA%\gcloud\application_default_credentials.json'
      kind: file
      platforms: [windows]
    - path: "$HOME/.config/gcloud/application_default_credentials.json"
      kind: file
      platforms: [linux, macos]
  content:
    contains:
      - client_id
      - refresh_token
credentials:
  types:
    - refresh-token
    - service-account
impact:
  credential_access: true
  cloud_access: true
tags:
  - gcp
  - cloud
references:
  - name: Google Cloud Application Default Credentials
    url: https://cloud.google.com/docs/authentication/application-default-credentials
metadata:
  confidence: high
